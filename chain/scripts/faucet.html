<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>People · Testnet Faucet</title>
<style>body{margin:0;background:#0c1111;color:#eef5ef;font:16px system-ui,sans-serif}main{max-width:540px;margin:8vh auto;padding:32px;border:1px solid #293a32;border-radius:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:36px;margin-bottom:12px}p{line-height:1.6;color:#b9c8be}label{display:block;margin-top:24px}input,button{box-sizing:border-box;font:inherit;border-radius:12px;padding:14px}input{width:100%;margin-top:8px;border:1px solid #3b5245;background:#141d17;color:inherit}button{border:0;background:#b5f38f;color:#122012;cursor:pointer}button:disabled{opacity:.5;cursor:wait}form button{width:100%;margin-top:24px}output{display:block;margin-top:20px;overflow-wrap:anywhere;line-height:1.5}small{color:#b9c8be}a{color:#b5f38f}@media(max-width:600px){main{margin:24px 16px;padding:24px}h1{font-size:30px}}</style>
<main><header><strong>People / PPL</strong><button id="language" type="button">EN</button></header><h1 id="title">Тестовые PPL</h1><p id="intro">Укажите адрес и сумму. Кран отправляет существующие тестовые монеты — они не имеют реальной стоимости.</p><small>Cosmos EVM · chain ID 97401 · PPL</small><form id="form"><label><span id="address-label">Адрес кошелька</span><input id="address" name="address" placeholder="0x…" autocomplete="off" required pattern="0x[0-9a-fA-F]{40}"></label><label><span id="amount-label">Сколько PPL получить</span><input id="amount" name="amount" value="10" inputmode="decimal" required maxlength="50"></label><button id="submit" type="submit">Получить тестовые PPL</button></form><output id="result" role="status" aria-live="polite"></output><p id="note">Запрос раз в минуту на адрес. Сумма ограничена остатком крана; стейк валидаторов не используется.</p></main>
<script>
let ru=true; const $=id=>document.getElementById(id);
const words={ru:{title:'Тестовые PPL',intro:'Укажите адрес и сумму. Кран отправляет существующие тестовые монеты — они не имеют реальной стоимости.',address:'Адрес кошелька',amount:'Сколько PPL получить',submit:'Получить тестовые PPL',note:'Запрос раз в минуту на адрес. Сумма ограничена остатком крана; стейк валидаторов не используется.',waiting:'Отправляем…',sent:'Транзакция отправлена. Дождитесь подтверждения:',errors:{invalid_address:'Проверьте адрес 0x…',invalid_amount:'Введите положительную сумму, до 18 знаков после точки.',rate_limited:'Повторите запрос через минуту.',faucet_insufficient_funds:'В кране недостаточно PPL для этой суммы и комиссии.',faucet_busy:'Кран занят. Попробуйте позднее.',faucet_unavailable:'Кран временно недоступен.'}},en:{title:'Testnet PPL',intro:'Enter your address and amount. The faucet sends existing test coins — they have no real value.',address:'Wallet address',amount:'Amount of PPL to receive',submit:'Get testnet PPL',note:'One request per minute per address. Amounts depend on the faucet balance; validator stake is never used.',waiting:'Sending…',sent:'Transaction submitted. Wait for confirmation:',errors:{invalid_address:'Check your 0x… address.',invalid_amount:'Enter a positive amount with at most 18 decimal places.',rate_limited:'Try again in one minute.',faucet_insufficient_funds:'The faucet cannot cover this amount and the fee.',faucet_busy:'The faucet is busy. Try again later.',faucet_unavailable:'The faucet is temporarily unavailable.'}}};
function render(){const t=words[ru?'ru':'en'];document.documentElement.lang=ru?'ru':'en';$('language').textContent=ru?'EN':'RU';for(const id of ['title','intro','submit','note'])$(id).textContent=t[id];$('address-label').textContent=t.address;$('amount-label').textContent=t.amount;}
$('language').onclick=()=>{ru=!ru;render();};
$('form').onsubmit=async event=>{event.preventDefault();const t=words[ru?'ru':'en'];$('submit').disabled=true;$('result').textContent=t.waiting;try{const response=await fetch('/faucet/fund',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address:$('address').value.trim(),amount:$('amount').value.trim().replace(',','.')})});const data=await response.json();if(!response.ok)throw new Error(data.message||t.errors[data.error]||t.errors.faucet_unavailable);$('result').textContent=t.sent+' '+data.txId;}catch(error){$('result').textContent=error.message||t.errors.faucet_unavailable;}finally{$('submit').disabled=false;}};
</script></html>
