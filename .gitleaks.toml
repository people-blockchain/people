# Extends the default gitleaks rules. Allowlist only known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Public contract addresses, event topics and documented public dev/test keys"
paths = [
  '''contracts/deployments/.*\.json''',
  '''website/src/data/evm-deployments-.*\.json''',
  # documented public dev/test keys (cosmos/evm dev0, unit-test fixtures) - zero balance, never used on funded networks
  '''chain/scripts/contracts-smoke\.sh''',
  '''contracts/scripts/smoke-local\.sh''',
  '''website/scripts/evm-embedded-key\.test\.mjs''',
  '''website/scripts/wallet-keep-current\.spec\.mjs''',
  '''website/scripts/evm-log-start-blocks\.test\.mjs''',
  # Unit-test vault wrap fixtures (repeated dummy strings / env names, not live secrets)
  '''website/scripts/wallet-cloud-server\.test\.mjs''',
  # Public ERC-20 addresses in recorded LiFi quotes and smoke docs (generic-api-key false positives)
  '''website/scripts/fixtures/lifi-quote-.*\.json''',
  '''docs/v2/SMOKE-ONE-TX\.md''',
  # Web3Auth client id is public by design (domain-restricted in the Web3Auth dashboard)
  '''website/src/lib/web3auth-config\.ts''',
  # Turnkey parent organization id is public (not an API key); real keys stay in env
  '''website/src/lib/turnkey-config\.ts''',
  '''website/src/lib/partner/.*\.test\.ts''',
  # Turnkey parent org id is public (documented in .env.example; not an API secret)
  '''website/\.env\.example''',
  '''website/src/lib/turnkey-config\.ts''',
]
commits = [
  # Turnkey wallet spike (404a576): public parent org id in .env.example, not live secrets
  "404a576a32d5c529d040236511b035f2c4497413",
]
regexTarget = "line"
regexes = [
  # keccak event topics (TOKEN_CREATED etc.)
  '''TOKEN_CREATED(_TOPIC)?\s*=''',
  '''TOKEN_CREATED(_TOPIC)?=''',
]

# Historic commit only: public Turnkey parent org id (not an API secret).
[[allowlists]]
description = "Public Turnkey org id in commit 404a576"
commits = [ "404a576a32d5c529d040236511b035f2c4497413" ]
