[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
ffi = true

fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./broadcast" }]

[rpc_endpoints]
local = "http://127.0.0.1:8545"

[fmt]
line_length = 120
