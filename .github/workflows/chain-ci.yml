name: People chain (Cosmos EVM)
on:
  pull_request:
    paths:
      - 'chain/**'
      - 'docs/COSMOS-EVM-MIGRATION.md'
      - '.github/workflows/chain-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chain/**'
      - 'docs/COSMOS-EVM-MIGRATION.md'
      - '.github/workflows/chain-ci.yml'
permissions:
  contents: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: chain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Test faucet
        run: node --test scripts/faucet.test.mjs
      - name: Test deployment config (RPC surface, key volumes)
        run: node --test scripts/deployment-config.test.mjs
      - name: Test fund-testnet script
        run: bash scripts/fund-testnet.test.sh
      - name: Build peopled
        run: bash scripts/build-peopled.sh
      - name: Smoke test (local 3-validator net)
        env:
          SKIP_CONTRACTS_SMOKE: "1"
        run: bash scripts/ci-smoke.sh
