name: People contracts (Foundry)
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/CONTRACTS-STAGE2.md'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/CONTRACTS-STAGE2.md'
      - '.github/workflows/contracts-ci.yml'
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: bash scripts/check-eip170.sh
      - run: forge test
