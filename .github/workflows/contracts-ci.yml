name: People contracts (Foundry)
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/CONTRACTS-STAGE2.md'
      - '.github/workflows/contracts-ci.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/CONTRACTS-STAGE2.md'
      - '.github/workflows/contracts-ci.yml'
permissions:
  contents: read
jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - run: forge build
      - run: bash scripts/check-eip170.sh
      - run: forge test
      - run: node --test scripts/sale-delivery-relayer-checks.test.mjs
