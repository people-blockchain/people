name: Build and publish public testnet node
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - people-node/**
      - .github/workflows/node-image.yml
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: people-node/package-lock.json
      - run: npm ci && npm run build && npm run typecheck && npm test && npm run test:public-node
        working-directory: people-node
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/people-node" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: people-node
          file: people-node/Dockerfile.node
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable image (publication still requires anonymous pull verification)
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Image built. Verify package public visibility and an anonymous pull before enabling website setup. Immutable reference $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
