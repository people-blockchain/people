name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify PWA shell assets
        run: |
          test -f apps/web/public/sw.js
          test -f apps/web/public/manifest.webmanifest
          test -f apps/web/public/icons/icon-192.png
      - name: Smoke two-node catch-up
        run: bash scripts/ci-smoke.sh
